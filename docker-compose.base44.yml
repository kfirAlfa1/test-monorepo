# Base44 development environment for test-monorepo.
#
# Runs the stack straight from the cloned source (no prebuilt app images), with
# live reload on both services:
#   web  -> Vite dev server on host port 3000 (the preview entry point)
#   api  -> uvicorn --reload on the compose network
# The browser only ever talks to port 3000; /api is proxied to the api service
# by the Vite dev server, so there is a single origin (same-origin, no CORS).
#
# Start: docker compose -f docker-compose.base44.yml up -d --build
name: test-monorepo

services:
  api:
    image: python:3.12-slim
    working_dir: /app
    restart: on-failure
    environment:
      - BASE44_PREVIEW_MODE
    volumes:
      - ./apps/api:/app
    # requirements.txt has no lock file, so sync it on every start, then run the
    # reloading dev server. --reload watches the bind-mounted source.
    command:
      - sh
      - -ec
      - pip install --no-cache-dir --disable-pip-version-check -q -r requirements.txt && exec uvicorn main:app --reload --reload-dir /app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:5173"
    environment:
      # Vite dev proxy target (see apps/web/vite.config.ts).
      - API_PROXY_TARGET=http://api:8000
      # Sandbox host domain: vite.config.ts derives the dev-server allowedHosts
      # wildcard from it (the sandbox hostname rotates). Only used when
      # BASE44_PREVIEW_MODE is "1".
      - BASE44_SANDBOX_HOST_DOMAIN
      # Honored by Vite >=6.1; harmless no-op on 5.4, kept for upgrades.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      # Bind mounts: make file watching reliable for live reload.
      - CHOKIDAR_USEPOLLING=1
      - BASE44_PREVIEW_MODE
    volumes:
      - ./apps/web:/app
      # Keep dependencies off the host checkout; installed on startup below.
      - web_node_modules:/app/node_modules
    # No lock file is committed, so install (without writing one) then run the
    # dev server bound to all interfaces.
    command:
      - sh
      - -ec
      - npm install --no-package-lock --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  web_node_modules:
